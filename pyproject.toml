[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-memory"
version = "0.1.0"
description = "Persistent evidence memory for iterative agent improvement"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "yellowagmi"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/yellowagmi/evidence-memory"
Issues = "https://github.com/yellowagmi/evidence-memory/issues"

[project.scripts]
evidence-memory = "evidence_memory.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
